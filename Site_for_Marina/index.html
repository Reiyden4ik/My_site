<!DOCTYPE html>
<html>
<head>
    <title>Марина - Киберлегенда</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #000000;
            --accent-color: #ff1a1a;
            --neon-red: #ff073a;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            padding: 4rem 1rem;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, transparent, var(--neon-red), transparent);
            filter: blur(2px);
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            text-shadow: 0 0 15px var(--neon-red);
            margin: 1rem 0;
        }

        nav {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        li a {
            color: var(--text-color);
            text-decoration: none;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--neon-red);
            transition: all 0.3s;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            display: block;
        }

        li a:hover {
            background: var(--neon-red);
            box-shadow: 0 0 20px var(--neon-red);
        }

        .collage {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .collage img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border: 2px solid var(--neon-red);
            transition: 0.3s;
            filter: grayscale(80%);
            cursor: pointer;
        }

        .collage img:hover {
            filter: grayscale(0);
            transform: scale(1.03);
        }

        .content {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            position: relative;
        }

        .cyber-text {
            text-align: justify;
            font-size: clamp(1rem, 3vw, 1.1rem);
            background: linear-gradient(45deg, #fff 30%, var(--neon-red) 70%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 1rem;
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }

        .heart {
            color: var(--neon-red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            border-top: 1px solid var(--neon-red);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 95%;
            height: 95vh;
            max-width: 1400px;
        }

        .modal-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 3px solid var(--neon-red);
            box-shadow: 0 0 30px var(--neon-red);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--neon-red);
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-red);
            font-size: 60px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            transition: 0.3s;
        }

        .nav-arrow:hover {
            text-shadow: 0 0 20px var(--neon-red);
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 2rem 1rem;
            }

            h1 {
                letter-spacing: 0.1em;
            }

            .collage img {
                height: 250px;
            }

            .modal-content {
                width: 98%;
                height: 90vh;
            }

            .nav-arrow {
                font-size: 40px;
                padding: 10px;
            }

            .close {
                font-size: 30px;
                top: 10px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .collage {
                grid-template-columns: 1fr;
            }

            .collage img {
                height: 200px;
            }

            .nav-arrow {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <script>
        (function() {
            const body = document.body;
            
            // Header
            const header = document.createElement('header');
            header.className = 'header';
            
            const h1 = document.createElement('h1');
            h1.textContent = 'ВΛД_OS';
            
            const headerP = document.createElement('p');
            headerP.textContent = 'Система версии 2077.ГЕНИЙ';
            
            header.append(h1, headerP);
            body.appendChild(header);

            // Navigation
            const nav = document.createElement('nav');
            const ul = document.createElement('ul');
            
            const navItems = [
                {text: 'Кибер-Ядро', hearts: 1},
                {text: 'Технические характеристики', hearts: 2},
                {text: 'Галактическое признание', hearts: 3}
            ];
            
            navItems.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${item.text.toLowerCase().replace(/\s+/g, '-')}`;
                
                const span = document.createElement('span');
                span.className = 'heart';
                span.textContent = ' ❤'.repeat(item.hearts);
                
                a.textContent = item.text;
                a.appendChild(span);
                li.appendChild(a);
                ul.appendChild(li);
            });
            
            nav.appendChild(ul);
            body.appendChild(nav);

            // Collage
            const collage = document.createElement('div');
            collage.className = 'collage';
            
            const images = [
                {src: 'photos/vlad1.jpg', alt: 'Влад - ТехноМастер'},
                {src: 'photos/vlad2.jpg', alt: 'Влад - Космический эксперт'},
                {src: 'photos/vlad3.jpg', alt: 'Влад - Легенда будущего'},
                {src: 'photos/vlad4.jpg', alt: 'Влад - Космический эксперт'}
            ];
            
            // Модальное окно
            const modal = document.createElement('div');
            modal.className = 'modal';
            
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            
            const modalImg = document.createElement('img');
            modalImg.className = 'modal-img';
            
            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '&times;';
            
            const prevArrow = document.createElement('div');
            prevArrow.className = 'nav-arrow prev';
            prevArrow.innerHTML = '&#10094;';
            
            const nextArrow = document.createElement('div');
            nextArrow.className = 'nav-arrow next';
            nextArrow.innerHTML = '&#10095;';
            
            modalContent.append(prevArrow, modalImg, nextArrow, closeSpan);
            modal.appendChild(modalContent);
            body.appendChild(modal);

            let currentImageIndex = 0;
            
            // Управление модальным окном
            function openModal(index) {
                currentImageIndex = index;
                modalImg.src = images[currentImageIndex].src;
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }

            function changeImage(step) {
                currentImageIndex = (currentImageIndex + step + images.length) % images.length;
                modalImg.src = images[currentImageIndex].src;
            }

            // Обработчики событий
            images.forEach((imgData, index) => {
                const img = document.createElement('img');
                img.src = imgData.src;
                img.alt = imgData.alt;
                img.addEventListener('click', () => openModal(index));
                collage.appendChild(img);
            });

            closeSpan.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if(e.target === modal) closeModal();
            });

            prevArrow.addEventListener('click', (e) => {
                e.stopPropagation();
                changeImage(-1);
            });

            nextArrow.addEventListener('click', (e) => {
                e.stopPropagation();
                changeImage(1);
            });

            // Управление клавиатурой
            document.addEventListener('keydown', (e) => {
                if(modal.style.display === 'block') {
                    switch(e.key) {
                        case 'ArrowLeft':
                            changeImage(-1);
                            break;
                        case 'ArrowRight':
                            changeImage(1);
                            break;
                        case 'Escape':
                            closeModal();
                            break;
                    }
                }
            });

            body.appendChild(collage);

            // Основной контент
            const main = document.createElement('main');
            main.className = 'content';
            
            const cyberText = document.createElement('div');
            cyberText.className = 'cyber-text';
            
            const contentHTML = `
                <h2>Квантовые характеристики системы Марина_Os:</h2>
                <p>✦ Процессор: 128-ядерный нейрочип поколения RX-9000. Способен обрабатывать 1 экзафлопс операций в наносекунду.
                Анализирует и оптимизирует реальность в режиме реального времени.</p>
                <p>✦ Память: Квантовая DDR6X с частотой 10000 МГц. Хранит знания всех цивилизаций Млечного Пути
                и 25 альтернативных вселенных.</p>
                <p>✦ Графика: RTX 9090 Ti с рейтрейсингом 16K. Визуализирует идейные концепты до их материализации.</p>
                <p>✦ Интерфейсы: Поддержка 360° голографической связи, телепатический ввод данных,
                квантовый Bluetooth 10.0 с радиусом действия 12 световых лет.</p>
                <p>✦ Особые функции:<br>
                - Генератор позитивной реальности v4.2<br>
                - Антигравитационная система поддержки<br>
                - Встроенный сарказм-детектор с AI фильтрацией<br>
                - Квантовый юмор-процессор с библиотекой из 10¹⁸ шуток</p>
                <p>✦ Безопасность: 512-битное шифрование, система распознавания друзей/врагов по квантовым колебаниям ауры,
                защита от любых форм сомнений и негатива.</p>
            `;
            
            cyberText.innerHTML = contentHTML;
            main.appendChild(cyberText);
            body.appendChild(main);

            // Футер
            const footer = document.createElement('footer');
            const footerP = document.createElement('p');
            footerP.innerHTML = 'ВНИМАНИЕ: Объект категории "LEGENDARY" - репликация запрещена! <span class="heart"> ❤❤❤</span>';
            
            footer.appendChild(footerP);
            body.appendChild(footer);
        })();
    </script>
</body>
</html>
